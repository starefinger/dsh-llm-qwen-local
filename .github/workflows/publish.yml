name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag"
        required: false
        default: "latest"

permissions:
  contents: read
  # Enable id-token: write AND re-add --provenance below once the package
  # exists and a trusted publisher is registered at
  # https://www.npmjs.com/package/dsh-llm-qwen-local/provenance
  # (repo: starefinger/dsh-llm-qwen-local, workflow: publish.yml).

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No pnpm cache / frozen lockfile: the repository gitignores
      # pnpm-lock.yaml by design.
      - name: Install, build, test
        run: |
          pnpm install
          pnpm build
          pnpm test

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm does not read NODE_AUTH_TOKEN; publish with a temporary
          # userconfig (value never printed). The runner home is wiped
          # after the job, so nothing needs manual cleanup.
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty or not set"
            exit 1
          fi
          USERCONFIG="$HOME/.npmrc-ci-publish"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$USERCONFIG"
          chmod 600 "$USERCONFIG"
          TAG="${{ inputs.tag || 'latest' }}"
          if [ "$TAG" = "latest" ]; then
            npm publish --registry https://registry.npmjs.org --userconfig "$USERCONFIG"
          else
            npm publish --registry https://registry.npmjs.org --tag "$TAG" --userconfig "$USERCONFIG"
          fi
          rm -f "$USERCONFIG"
