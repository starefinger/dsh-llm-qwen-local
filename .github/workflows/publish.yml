name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag"
        required: false
        default: "latest"

permissions:
  contents: read
  # Enable id-token: write AND re-add --provenance below once the package
  # exists and a trusted publisher is registered at
  # https://www.npmjs.com/package/dsh-llm-qwen-local/provenance
  # (repo: starefinger/dsh-llm-qwen-local, workflow: publish.yml).

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No pnpm cache / frozen lockfile: the repository gitignores
      # pnpm-lock.yaml by design.
      - name: Install, build, test
        run: |
          pnpm install
          pnpm build
          pnpm test

      - name: Publish
        run: |
          TAG="${{ inputs.tag || 'latest' }}"
          if [ "$TAG" = "latest" ]; then
            npm publish --registry https://registry.npmjs.org
          else
            npm publish --registry https://registry.npmjs.org --tag "$TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
