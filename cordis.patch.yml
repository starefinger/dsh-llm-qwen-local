# Baseline layer contributed by the dsh-llm-qwen-local bundle.
#
# Tuned for Qwen/Qwen3.8-27B (native 262,144-token context; vision-language
# model; thinking ON by default; official reasoning_effort levels
# xhigh (default) / medium / low).
#
# Override the whole line from your profile's cordis.patch.yml by the same
# `id` — a patch replaces the target line's ENTIRE config value (no deep
# merge), so restate every key you keep. Two common edits:
#
#   1. Deployment serves a text-only checkpoint — drop the vision claim:
#        - id: llm-qwen-local
#          ...
#          config:
#            models:
#              - id: qwen3.8
#                multimodal: false
#
#   2. Match your vLLM reasoning_effort vocabulary (any wire spelling works;
#      only `off` may use `wire: null`):
#        reasoning:
#          efforts:
#            - { id: off, wire: null }
#            - { id: low, wire: low }
#            - { id: medium, wire: medium }
#            - { id: xhigh, wire: xhigh }
#          defaultEffort: xhigh
- insert:
    - id: llm-qwen-local
      name: dsh-llm-qwen-local
      config:
        baseURL: !!js "process.env.QWEN_LOCAL_BASE_URL ?? 'http://127.0.0.1:8000/v1'"
        models:
          - id: qwen3.8
            name: Qwen3.8-27B (local)
            multimodal: true
            reasoning:
              efforts:
                - id: off
                  wire: low
                - id: low
                  wire: low
                - id: medium
                  wire: medium
                - id: xhigh
                  wire: xhigh
              defaultEffort: xhigh
