allowBuilds:
  esbuild: true
# This port pins the DSH 0.2.0-rc.2 line in its devDependencies, which lands
# on the registry within pnpm's default 24h minimum-release-age window. The
# age gate is disabled here so a fresh release wave does not break
# `pnpm install` for this compatibility target. (The 0.1.2-rc.1 exclusion
# list that previously served the same purpose was removed along with it.)
minimumReleaseAge: 0
